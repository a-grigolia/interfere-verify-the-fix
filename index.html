<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify the Fix</title>
<meta name="description" content="Verify the fix: a concept for Interfere by Avto Grigolia.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
/* Interfere app shell, styled from the published design system (design.interfere.com), dark theme only. Token names follow theirs; component sizes, radii and colours were measured from the live components. The layout comes from the product demo. The customer's light app, nested inside replays and previews, is not part of the system. */
@font-face{font-family:"Paper Mono";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/PaperMono-Regular.woff2") format("woff2")}
@font-face{font-family:"Paper Mono";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/PaperMono-Medium.woff2") format("woff2")}
:root{
  color-scheme: dark;
  /* grey scale and its translucent twin */
  --gray-1:#111111; --gray-2:#191919; --gray-3:#222222; --gray-4:#2a2a2a; --gray-5:#313131; --gray-6:#3a3a3a; --gray-7:#484848; --gray-8:#606060; --gray-9:#6e6e6e; --gray-10:#7b7b7b; --gray-11:#b4b4b4; --gray-12:#eeeeee;
  --gray-a2:#ffffff09; --gray-a3:#ffffff12; --gray-a4:#ffffff1b; --gray-a5:#ffffff22; --gray-a6:#ffffff2c; --gray-a7:#ffffff3b; --gray-a8:#ffffff55; --gray-a9:#ffffff64; --gray-a10:#ffffff72; --gray-a11:#ffffffaf; --gray-a12:#ffffffed;
  --white-a10:#ffffffcc; --white-a12:#fffffff2; --black-a3:#00000026; --black-a6:#00000066; --black-a7:#00000080;
  /* colour scales, only the steps used here */
  --blue-9:#0090ff; --blue-11:#70b8ff; --blue-a3:#0077ff3a;
  --green-9:#30a46c; --green-a2:#29f99d0b; --green-a3:#22ff991e; --green-a5:#2bffa23c; --green-a6:#44ffaa4b; --green-a11:#46fea5d4;
  --grass-9:#46a758; --grass-a11:#89ff9fcd;
  --tomato-9:#e54d2e; --tomato-10:#ec6142; --tomato-11:#ff977d; --tomato-a2:#ff55330f; --tomato-a3:#ff35232b; --tomato-a6:#ff4f3864; --tomato-a10:#ff6847eb;
  --amber-9:#ffc53d; --amber-11:#ffca16; --amber-a2:#fd9b000d; --amber-a3:#fa820022; --amber-a5:#fd8b0041;
  --violet-10:#7d66d9; --indigo-10:#5472e4; --cyan-11:#4ccce6;
  --purple-11:#d19dff; --purple-a3:#c150ff2d; --crimson-9:#e93d82; --plum-10:#b658c4;
  /* surfaces */
  --shell:#000000;                      /* behind the sidebar */
  --page:oklch(15% 0 0);                /* toasts */
  --container:var(--gray-1);            /* the working pane, code cards */
  --raised:var(--gray-2);               /* floating bars */
  --card:var(--gray-a2);                /* subtle card */
  --component:var(--gray-a3);           /* buttons, badges, strong card */
  --component-hover:var(--gray-a4);
  /* text */
  --fg:var(--gray-a12);                 /* primary */
  --fg-p:var(--white-a10);              /* paragraphs */
  --fg-2:var(--gray-a11);               /* secondary */
  --fg-3:var(--gray-a9);                /* tertiary */
  --fg-dis:var(--gray-a8);
  /* borders and shadows */
  --line:var(--gray-a3); --line-strong:var(--gray-a6);
  --s-default:inset 0 0 0 .5px #ffffff12;
  --s-border:0 0 0 1px #ffffff12;
  --s-large:0 0 0 1px var(--gray-a6),0 2px 3px -2px var(--black-a3),0 3px 8px -2px var(--black-a6),0 4px 12px -4px var(--black-a7);
  /* status pairs: text on a subtle fill, the fill, its border, and the solid */
  --ok:var(--green-a11);   --ok-soft:var(--green-a3);  --ok-line:var(--green-a5);  --ok-solid:var(--green-9);
  --bad:var(--tomato-11);  --bad-soft:var(--tomato-a3); --bad-line:var(--tomato-a6); --bad-solid:var(--tomato-9);
  --rec:var(--amber-11);   --rec-soft:var(--amber-a3);  --rec-line:var(--amber-a5);
  --accent:var(--violet-10);
  --add:var(--grass-9); --del:var(--tomato-9);
  /* the customer's app (Resonance) stays light */
  --m-bg:#fbfaf7; --m-panel:#ffffff; --m-fg:#1d1c1a; --m-mute:#8b8880; --m-line:#e8e5df;
  --sans:"Inter","InterVariable",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Paper Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  /* radius scale: xs 2, sm 4, md 6, lg 8, xl 10, 2xl 12, 3xl 16 */
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:10px; --r-2xl:12px; --r-3xl:16px;
}
html,body{height:100%}
body{background:var(--shell);color:var(--fg-2);font-family:var(--sans);font-feature-settings:"ss03";font-size:13px;line-height:20px;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;font-feature-settings:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue-9);outline-offset:1px}
/* Kbd, small: 16px key, 11px medium */
kbd{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 1px;font-family:var(--sans);font-size:11px;line-height:16px;font-weight:500;color:var(--fg-2);background:var(--component);border:1px solid var(--line);border-radius:var(--r-sm)}
.mono{font-family:var(--mono)}
.tab{font-variant-numeric:tabular-nums}
.fi{width:16px;height:16px;flex:none;display:block}
.mark{display:block;flex:none}

.app{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%;padding:4px max(4px,env(safe-area-inset-right,0px)) 4px env(safe-area-inset-left,0px)}

/* sidebar: 28px rows, 6px radius, 13px medium. The nav scrolls; the concept guide and persona stay pinned so the walkthrough is always visible. */
.side{display:flex;flex-direction:column;min-height:0;padding:4px 12px 4px}
.side-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding-bottom:16px;-webkit-mask-image:linear-gradient(#000 calc(100% - 20px),transparent);mask-image:linear-gradient(#000 calc(100% - 20px),transparent)}
.side-scroll::-webkit-scrollbar{display:none}
.side-pin{flex:none}
.ws{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;font-weight:500;color:var(--fg)}
.ws-logo{width:20px;height:20px;border-radius:var(--r-md);background:var(--white-a12);color:#000;display:grid;place-items:center;font-size:11px;font-weight:600}
.ws svg{color:var(--fg-3);width:12px;height:12px}
.qa{display:flex;align-items:center;gap:6px;height:28px;margin:0 0 12px;padding:0 6px;border-radius:var(--r-md);background:var(--component);box-shadow:var(--s-default);color:var(--fg);font-weight:500;cursor:pointer}
.qa:hover{background:var(--component-hover)}
.qa svg{color:var(--fg-2)}
.qa span{flex:1}
.qa .k{flex:none;display:flex;gap:2px}
.nav,.prob{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r-md);color:var(--fg-2);text-align:left;width:100%;font-weight:500;white-space:nowrap}
.nav:hover,.prob:hover{background:var(--component-hover);color:var(--fg)}
.nav.on,.prob.on{background:var(--component-hover);color:var(--fg)}
.nav.on .fi{color:var(--fg)}
.prob span:last-child{overflow:hidden;text-overflow:ellipsis}
.bugt{width:16px;height:16px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.side-h{padding:0 8px;margin:16px 0 4px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}
.side-foot{display:flex;align-items:center;gap:8px;padding:10px 8px 6px}
.side-foot .mark{margin-left:auto;color:var(--fg-3)}
/* Avatar: round, 24px, 10px initials at weight 450. Tinted per persona so the switch to the engineer is visible. */
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:14px;font-weight:450;flex:none;background:var(--component);color:var(--fg)}
.av.j{background:var(--blue-a3);color:var(--blue-11)}
.av.s{background:var(--purple-a3);color:var(--purple-11)}
.av.xs{width:16px;height:16px;font-size:8px;line-height:12px}
.who{min-width:0;line-height:16px}
.who b{font-weight:500;display:block;line-height:20px;color:var(--fg)}
.who small{color:var(--fg-3);font-size:12px}

/* working pane */
.main{background:var(--container);border:1px solid var(--line);border-radius:var(--r-3xl);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;border-bottom:1px solid var(--line);height:44px;flex:none}
.bar > svg{color:var(--fg-3)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;color:var(--fg-2);white-space:nowrap;overflow:hidden;font-weight:500}
.crumbs svg{color:var(--fg-3);flex:none}
.crumbs b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs button:hover{color:var(--fg)}
.bar-actions{display:flex;gap:6px;align-items:center}
/* Button. Default is their Secondary at Medium: 28px, 6px radius, 13px medium, hairline inset. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-md);background:var(--component);box-shadow:var(--s-default);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--component-hover)}
.btn.lg{height:32px;padding:0 12px;border-radius:var(--r-lg)}
.btn.primary{background:var(--white-a12);color:#000;box-shadow:none}
.btn.primary:hover{background:var(--white-a10)}
.btn.ghost{background:none;box-shadow:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--component-hover)}
.btn.danger{background:var(--tomato-a2);color:var(--tomato-a10);box-shadow:none}
.btn.danger:hover{background:var(--tomato-a3)}
.btn.primary kbd{color:#000;background:var(--black-a3);border-color:transparent}
.btn[disabled],.btn[disabled]:hover{background:var(--gray-a2);color:var(--fg-dis);box-shadow:none;cursor:not-allowed}
.btn[disabled] kbd{color:inherit;background:var(--gray-a2);border-color:var(--line)}
.ib{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--component);box-shadow:var(--s-default);color:var(--fg);flex:none}
.ib:hover{background:var(--component-hover)}
/* Tabs, default: a 28px list on the component fill, the active tab one step lighter */
.seg{display:flex;height:28px;border-radius:var(--r-md);background:var(--component)}
.seg span{display:inline-flex;align-items:center;padding:0 10px;border-radius:var(--r-md);color:var(--fg-2);font-weight:500;cursor:pointer}
.seg span.on{background:var(--component);color:var(--fg)}
.content{flex:1;overflow:auto;min-height:0}

/* board: centred column labels, status glyph left, count right */
.board{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:8px;padding:8px;min-width:min-content}
.col{background:var(--card);border-radius:var(--r-2xl);padding:6px;display:flex;flex-direction:column;gap:6px;min-height:420px}
.col-h{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;align-items:center;padding:4px 4px 2px;font-size:11px;line-height:16px;letter-spacing:.05em;text-transform:uppercase;text-align:center;color:var(--fg-3);font-weight:500}
.col-h svg{justify-self:start;margin-left:2px}
.col-h .n{justify-self:end;background:var(--component);border-radius:var(--r-sm);padding:0 6px;color:var(--fg-2);font-weight:400;letter-spacing:0}
.card{background:var(--component);box-shadow:var(--s-default);border-radius:var(--r-lg);padding:10px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}
.card:hover{background:var(--component-hover)}
.card.live{box-shadow:inset 0 0 0 1px var(--green-a6)}
.card-id{display:flex;justify-content:space-between;align-items:center;color:var(--fg-3);font-family:var(--mono);font-size:11px;line-height:16px;letter-spacing:.02em}
.card-t{display:flex;gap:8px;font-weight:600;color:var(--fg)}
.card-t .bugt{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
/* Badge. Large (24px, 6px radius, 13px) for card metadata; .sm is their Medium (20px, 4px radius, 12px) for inline statuses. */
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--r-md);font-size:13px;line-height:20px;font-weight:400;color:var(--fg-2);background:var(--component);white-space:nowrap}
.chip.sm{height:20px;padding:0 6px;border-radius:var(--r-sm);font-size:12px;line-height:16px}
.chip > svg{opacity:.7}
/* Tier summary: shade-tinted gems with a +N overflow */
.chip.tier{gap:2px;padding:0 8px 0 6px}
.chip.tier svg{opacity:1}
.chip.tier small{font-size:12px;line-height:16px;margin-left:2px}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.bad{color:var(--bad);background:var(--bad-soft)}
.chip.rec{color:var(--rec);background:var(--rec-soft)}
.chip.ok > svg,.chip.bad > svg,.chip.rec > svg{opacity:1}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.col-empty{color:var(--fg-3);padding:8px;line-height:20px}

/* problem view: a narrow property column (details, dates, counts + chart, split by rules) beside the activity column. Each column scrolls on its own so the details stay put while the timeline moves. */
.prob-wrap{display:grid;grid-template-columns:minmax(300px,36%) minmax(0,1fr);height:100%}
.prob-l{border-right:1px solid var(--line);min-width:0;overflow:auto}
.psec{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.psec + .psec{border-top:1px solid var(--line)}
.prob-l .h1{margin-top:4px}
.prob-l .lede{margin-bottom:8px}
.prob-r{padding:8px 24px 32px;min-width:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
.prob-r > *{flex-shrink:0}
.prob-r .mini-editor{height:110px}
.prob-r .pl-stage{padding:10px 0}
.bug-badge{width:40px;height:40px;border-radius:var(--r-xl);display:grid;place-items:center}
/* Heading 5: 24/32 semibold, -0.01em */
.h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em;color:var(--fg);text-wrap:balance;margin:0}
.h1.h6{font-size:20px;line-height:24px}
.lede{color:var(--fg-p);max-width:62ch;margin:0}
.props{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;margin:0}
.props dt{color:var(--fg-3)}
.props dd{margin:0;display:flex;align-items:center;gap:6px;min-width:0;color:var(--fg);font-weight:450}
.props dd.none{color:var(--fg-3);font-weight:400}
.appn{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.3px currentColor;display:grid;place-items:center;font-size:9px;font-weight:600;flex:none}
.counts{display:flex;gap:40px}
.counts small{display:block;color:var(--fg-3);font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.counts b{font-size:15px;line-height:24px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
/* Caption, uppercase */
.sec-h{font-size:11px;line-height:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);font-weight:500;display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sec-h .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;font-weight:400}

.tabs{display:flex;gap:2px;align-items:center;height:44px}
.tabs span{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:var(--r-md);color:var(--fg-2);font-weight:500}
.tabs span.on{background:var(--component-hover);color:var(--fg)}
.tabs .cm{margin-left:auto;gap:6px}

.tl{display:flex;flex-direction:column;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--gray-a4)}
.tl-i{position:relative;padding:4px 0 16px}
.tl-i::before{content:"";position:absolute;left:-19px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--gray-8);box-shadow:0 0 0 3px var(--container)}
.tl-i.ok::before{background:var(--ok-solid)}
.tl-i.wait::before{background:var(--ok-solid);animation:pulse 1.6s infinite}
.tl-i.bad::before{background:var(--bad-solid)}
.tl-i.rec::before{background:var(--amber-9)}
.tl-h{display:flex;align-items:center;gap:8px;color:var(--fg-2);flex-wrap:wrap}
.tl-h b{color:var(--fg);font-weight:500}
.tl-h time{color:var(--fg-3);font-size:12px;line-height:16px}
.tl-h .mark{color:var(--fg-2)}
.tl-p{color:var(--fg-p);margin:4px 0 0;max-width:68ch}
/* Card, strong */
.box{background:var(--component);box-shadow:var(--s-default);border-radius:var(--r-2xl);padding:12px 14px;margin-top:8px}
.box p{margin:0;color:var(--fg-p);max-width:68ch}
.disclose{display:flex;align-items:center;gap:6px;height:32px;margin-top:10px;padding:0 10px;border-radius:var(--r-lg);background:var(--component);width:100%;color:var(--fg-2);font-weight:500;text-align:left}
.disclose:hover{color:var(--fg);background:var(--component-hover)}
.disclose svg{transition:transform .15s}
.disclose[aria-expanded="true"] svg{transform:rotate(90deg)}
/* the waiting fix: a card on the positive tint */
.fixcard{box-shadow:inset 0 0 0 1px var(--ok-line);background:var(--green-a2);border-radius:var(--r-2xl);padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.fixcard-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fixcard-top b{font-weight:500;color:var(--fg)}
.fixcard .url{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--fg-2);background:var(--container);box-shadow:var(--s-border);border-radius:var(--r-md);padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixcard-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fixcard-row .grow{flex:1;color:var(--fg-2);min-width:180px}

/* Code Card: container fill, 10px radius, hairline inset, 33px header, 13/20 mono, their syntax colours */
.code{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--container);box-shadow:inset 0 0 0 1px var(--line);margin-top:8px}
.code-h{display:flex;align-items:center;gap:8px;width:100%;height:33px;padding:0 10px 0 8px;border-bottom:1px solid var(--gray-3);font-family:var(--mono);font-size:12px;line-height:16px;color:var(--fg-2);text-align:left}
.code-h:hover{color:var(--fg)}
.code-h > svg{flex:none;transition:transform .15s}
.code-h[aria-expanded="true"] > svg{transform:rotate(90deg)}
.code-h[aria-expanded="false"]{border-bottom-color:transparent}
.code-h .ts{font-family:var(--sans);font-size:9px;line-height:12px;font-weight:600;background:#3178c6;color:#fff;border-radius:2px;padding:1px 3px}
.code-h .stat{margin-left:auto}
.code-h .stat i{font-style:normal}
.code-scroll{overflow-x:auto;padding:6px 0}
.code table{border-collapse:collapse;font-family:var(--mono);font-size:13px;line-height:20px;min-width:100%}
.code td{padding:0 12px 0 0;white-space:pre;color:var(--fg)}
.code td.n{color:var(--fg-3);text-align:right;padding:0 12px 0 14px;user-select:none;width:1%}
.code tr.del{background:color-mix(in srgb,var(--del) 16%,transparent)}
.code tr.add{background:color-mix(in srgb,var(--add) 16%,transparent)}
.code tr.del td.n{box-shadow:inset 2px 0 var(--del)}
.code tr.add td.n{box-shadow:inset 2px 0 var(--add)}
.tk-k{color:var(--crimson-9)}.tk-f{color:var(--plum-10)}.tk-s{color:var(--grass-9)}.tk-c{color:var(--fg-3)}.tk-n{color:var(--blue-9)}

/* mini customer app (replay + preview), framed like the app's session player: URL pill above a black letterboxed stage */
.pl{user-select:none}
.pl-bar{display:flex;align-items:center;gap:6px;margin:0 auto 8px;max-width:88%}
.pl-url{flex:1;min-width:0;text-align:center;font-size:12px;line-height:16px;color:var(--fg-2);background:var(--component);border-radius:var(--r-md);padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-reload{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--component);box-shadow:var(--s-default);color:var(--fg);flex:none}
.pl-reload:hover{background:var(--component-hover)}
.pl-stage{background:#000;border-radius:var(--r-2xl);padding:16px 0;overflow:hidden}
.mini-inner{position:relative;overflow:hidden}
.mini-page{position:relative;background:var(--m-bg);color:var(--m-fg);font-family:var(--sans)}
.mini-nav{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--m-line);font-size:11.5px}
.mini-nav b{font-weight:600;margin-right:auto}
.mini-nav span{color:var(--m-mute);text-decoration:underline;text-underline-offset:2px}
.mini-nav i{width:16px;height:16px;border-radius:50%;background:#7b74e8;display:block}
.mini-body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:3px}
.mini-crumb{font-size:10.5px;color:var(--m-mute)}
.mini-h{font-size:17px;font-weight:600;letter-spacing:-.01em}
.mini-sub{font-size:11.5px;color:var(--m-mute);margin-bottom:8px}
.mini-editor{background:var(--m-panel);border:1px solid var(--m-line);border-radius:7px;height:150px;position:relative;overflow:hidden}
.mini-editor .txt,.mini-editor textarea{position:absolute;inset:0;padding:10px 12px;font:12px/1.55 var(--sans);color:var(--m-fg);white-space:pre-wrap;overflow:hidden;border:0;background:transparent;resize:none;width:100%;height:100%;user-select:text}
.mini-editor textarea{overflow:auto}
.mini-editor textarea:focus{outline:none}
.mini-editor:focus-within{border-color:#b9b4f5;box-shadow:0 0 0 3px rgba(123,116,232,.15)}
.mini-editor .ph{position:absolute;left:12px;top:10px;font-size:12px;color:#b7b3aa;pointer-events:none}
.mini-foot{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--m-mute);margin-top:6px;min-height:20px}
.mini-status{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:500}
.mini-status.saved{color:#2f8a5b}
.mini-status.err{color:#c23f5a}
.mini-sample{font-size:11px;color:#5d56d6;background:#efeefc;border:1px solid #dedcf8;border-radius:5px;padding:2px 8px;font-weight:500}
.mini-sample:hover{background:#e6e4fb}
.mini-reloading{position:absolute;inset:0;background:var(--m-bg);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .12s}
.mini-reloading.on{opacity:1}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--m-line);border-top-color:#7b74e8;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mini-cursor{position:absolute;left:0;top:0;width:16px;height:16px;pointer-events:none;z-index:5;transition:transform .08s linear;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.mini-cursor .click{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;border:2px solid #7b74e8;opacity:0;transform:scale(.3)}
.mini-cursor.clicking .click{animation:clk .45s ease-out}
@keyframes clk{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}
/* the "Note lost" flag is Interfere's annotation over the recording, so it takes the danger solid */
.mini-flag{position:absolute;right:10px;bottom:10px;background:var(--bad-solid);color:#fff;font-size:11px;line-height:16px;font-weight:500;border-radius:var(--r-sm);padding:2px 6px;opacity:0;transform:translateY(4px);transition:.2s;z-index:4}
.mini-flag.on{opacity:1;transform:none}

/* replay controls: white scrubber with event dots, timecode left, transport centred */
.rp-track{position:relative;height:20px;margin-top:10px;cursor:pointer;touch-action:none}
.rp-rail{position:absolute;left:0;right:0;top:7px;height:6px;border-radius:3px;background:var(--component-hover)}
.rp-fill{position:absolute;left:0;top:7px;height:6px;min-width:6px;max-width:100%;border-radius:3px;background:#fff}
.rp-mk{position:absolute;top:8.5px;width:3px;height:3px;border-radius:50%;background:var(--cyan-11);transform:translateX(-50%)}
.rp-mk.bug{background:var(--bad-solid);width:8px;height:8px;top:6px;box-shadow:0 0 0 2px var(--container)}
.rp-knob{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.rp-ctl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;margin-top:4px}
.rp-time{color:var(--fg-3);font-size:12px;line-height:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rp-time b{color:var(--fg);font-weight:500}
.rp-mid{display:flex;align-items:center;gap:6px}
.rp-play{width:32px;height:32px;border-radius:50%;background:var(--white-a12);color:#000;display:grid;place-items:center;flex:none}
.rp-play:hover{background:var(--white-a10)}
.rp-skip,.rp-x{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--fg-2)}
.rp-skip:hover,.rp-x:hover{background:var(--component-hover);color:var(--fg)}
.rp-end{display:flex;justify-content:flex-end;gap:2px}
.rp-cap{margin-top:6px;display:flex;align-items:center;gap:8px;color:var(--fg-2);min-height:20px}
.rp-cap b{font-weight:500;color:var(--fg)}
.rp-cap.bug b{color:var(--bad)}

/* verify */
.vf{padding:18px 24px 120px;display:flex;flex-direction:column;gap:14px}
/* the player is tall, so the verify panes run a little tighter to keep the checklist above the decision bar */
.vf .mini-editor{height:116px}
.vf .pl-stage{padding:10px 0}
.vf-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.vf-head p{margin:6px 0 0;color:var(--fg-2);max-width:70ch;font-size:15px;line-height:24px}
.vf-head .timer{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12px;line-height:16px;padding-top:8px}
.rec-dot{width:7px;height:7px;border-radius:50%;background:var(--bad-solid);animation:pulse 1.4s infinite}
.panes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pane-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pane-h b{font-weight:500;color:var(--fg)}
.pane-h small{color:var(--fg-3);font-size:12px;line-height:16px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
/* Card, subtle. The tick box takes their Checkbox shape and fills with the positive solid once the step is done. */
.step{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--s-default);transition:box-shadow .2s,background .2s}
.step .ck{width:16px;height:16px;border-radius:var(--r-sm);background:var(--component);box-shadow:inset 0 0 0 1px var(--line-strong);display:grid;place-items:center;flex:none;margin-top:2px;color:transparent;transition:.2s}
.step.done{background:var(--green-a2);box-shadow:inset 0 0 0 1px var(--ok-line)}
.step.done .ck{background:var(--ok-solid);box-shadow:none;color:#fff}
.step b{display:block;font-weight:500;color:var(--fg)}
.step small{color:var(--fg-3);font-size:12px;line-height:16px;display:block;margin-top:2px}
.decide{position:sticky;bottom:0;margin:0 -24px -120px;padding:12px 24px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--container) 30%);display:flex;flex-direction:column;gap:10px}
.decide-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--raised);box-shadow:var(--s-large);border-radius:var(--r-2xl);padding:8px 8px 8px 14px}
.decide-row .msg{flex:1;color:var(--fg-2);min-width:200px}
.decide-row .msg b{color:var(--fg);font-weight:500}
.broken{background:var(--raised);box-shadow:inset 0 0 0 1px var(--bad-line);border-radius:var(--r-2xl);padding:12px;display:flex;flex-direction:column;gap:8px}
.broken label{font-weight:500;color:var(--fg)}
.broken textarea{width:100%;min-height:70px;background:var(--component);border:0;box-shadow:var(--s-default);border-radius:var(--r-md);color:var(--fg);font:inherit;padding:8px 10px;resize:vertical}
.broken textarea::placeholder{color:var(--fg-3)}
.broken .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* handoff */
.ho{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:100%}
.ho-main{padding:24px 24px 32px;min-width:0;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line)}
.ho-side{padding:24px 16px 32px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pr-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--fg-2)}
.branch{font-family:var(--mono);font-size:12px;line-height:16px;background:var(--component);border-radius:var(--r-sm);padding:2px 6px;color:var(--fg)}
.vcard{box-shadow:inset 0 0 0 1px var(--ok-line);background:var(--green-a2);border-radius:var(--r-2xl);padding:14px;display:flex;flex-direction:column;gap:8px}
.vcard-h{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:500}
.vcard p{margin:0;color:var(--fg-p)}
.vcard .quote{border-left:2px solid var(--ok-line);padding-left:10px;color:var(--fg-2)}
.vcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;color:var(--fg-2)}
.vcard li{display:flex;gap:6px;align-items:center}
.vcard li svg{color:var(--ok);flex:none}
.scard{background:var(--card);box-shadow:var(--s-default);border-radius:var(--r-2xl);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.scard h4{margin:0;font-size:11px;line-height:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:10px}
.kv span{color:var(--fg-3);display:inline-flex;align-items:center;gap:6px}
.kv b{font-weight:450;color:var(--fg)}
.merge{display:flex;flex-direction:column;gap:8px}

/* recovery */
.reccard{box-shadow:inset 0 0 0 1px var(--rec-line);background:var(--amber-a2);border-radius:var(--r-2xl);padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.reccard .stats{display:flex;gap:24px;flex-wrap:wrap}
.reccard .stats div{display:flex;flex-direction:column}
.reccard .stats small{color:var(--fg-3);font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.reccard .stats b{font-size:18px;line-height:24px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.draft{background:var(--container);box-shadow:var(--s-border);border-radius:var(--r-lg);padding:10px 12px;color:var(--fg-p);white-space:pre-wrap}
.draft-h{display:flex;align-items:center;gap:8px;color:var(--fg-2);flex-wrap:wrap}
.draft-h .btn{margin-left:auto}

/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart-legend{display:flex;gap:14px;font-size:12px;line-height:16px;color:var(--fg-3);margin-bottom:6px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}

/* concept guide (sidebar card) */
.gs{margin-top:4px;background:var(--card);box-shadow:var(--s-default);border-radius:var(--r-2xl);overflow:hidden;flex:none}
.gs-h{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
.gs-h b{font-weight:500;display:block;color:var(--fg)}
.gs-h small{color:var(--fg-3);font-size:12px;line-height:16px;display:block}
.guide-mark{width:24px;height:24px;border-radius:var(--r-md);background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.gs-steps{display:flex;flex-direction:column;padding:2px 4px 4px}
.gstep{display:flex;gap:8px;align-items:flex-start;padding:4px 8px;border-radius:var(--r-md);text-align:left;color:var(--fg-2);width:100%}
.gstep:hover{background:var(--component-hover);color:var(--fg)}
.gstep.on{background:var(--component-hover);color:var(--fg)}
.gstep .num{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-strong);display:grid;place-items:center;font-size:10px;line-height:14px;flex:none;margin-top:2px;font-family:var(--mono)}
.gstep.on .num{background:var(--white-a12);color:#000;box-shadow:none}
.gstep b{font-weight:500;display:block}
.gstep small{display:none;font-size:12px;color:var(--fg-3);line-height:16px;margin:2px 0 2px}
.gstep.on small{display:block}
.gs-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--fg-3)}
.gs-foot button{color:var(--fg-2)}
.gs-foot button:hover{color:var(--fg)}
.gbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--container);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:4px;align-items:center}
.gbar .gstep{flex:1;justify-content:center;align-items:center;padding:6px 4px;gap:6px}
.gbar .gstep b{font-size:12px;white-space:nowrap}
.gbar .gstep small{display:none}

/* Toast: bottom right, page fill, 1px ring, 10px radius. On the verify screen the decision bar owns that corner, so it moves to the top right. */
.toast{position:fixed;right:16px;bottom:16px;transform:translateY(8px);background:var(--page);box-shadow:var(--s-border),0 8px 24px -8px #000;color:var(--fg);padding:14px 16px;border-radius:var(--r-xl);opacity:0;pointer-events:none;transition:.2s;z-index:40;display:flex;gap:8px;align-items:center;width:max-content;max-width:min(356px,calc(100% - 32px))}
.toast svg{color:var(--ok);flex:none}
.toast.on{opacity:1;transform:none}
body[data-view="verify"] .toast{bottom:auto;top:60px;transform:translateY(-8px)}
body[data-view="verify"] .toast.on{transform:none}

@media (max-width: 1100px){
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ho{grid-template-columns:minmax(0,1fr)}
  .ho-main{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width: 960px){
  .prob-wrap{grid-template-columns:minmax(0,1fr);height:auto}
  .prob-l{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .prob-r{overflow:visible}
  .panes{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .side{display:none}
  .board{grid-template-columns:minmax(0,1fr);min-width:0}
  .col{min-height:0}
  .bar .seg,.bar .hide-sm{display:none}
  .pl-bar{max-width:100%}
  .gbar{display:flex}
  .psec,.prob-r,.ho-main,.ho-side{padding-left:16px;padding-right:16px}
  .vf{padding-left:16px;padding-right:16px}
  .decide{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .h1{font-size:20px;line-height:24px}
  .props{grid-template-columns:100px minmax(0,1fr)}
  /* no room beside the bottom bars on a phone, so the toast drops in from the top */
  .toast,body[data-view="verify"] .toast{left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;width:auto;max-width:none;transform:translateY(-8px)}
  .toast.on{transform:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Workspace">
    <div class="side-scroll">
      <div class="ws"><div class="ws-logo">R</div>Resonance <span data-icon="chevdown"></span></div>
      <div class="qa" role="button" tabindex="0" data-toast="Quick actions isn't part of this concept"><span data-icon="search"></span><span>Quick actions</span><span class="k"><kbd>⌘</kbd><kbd>K</kbd></span></div>
      <button class="nav" data-go="inbox" id="nav-inbox"><span data-fi="inbox"></span>Inbox</button>
      <button class="nav" data-toast="Activity isn't part of this concept"><span data-fi="bell"></span>Activity</button>
      <button class="nav" data-toast="Apps isn't part of this concept"><span data-fi="layers"></span>Apps</button>
      <button class="nav" data-toast="Services isn't part of this concept"><span data-fi="connections"></span>Services</button>
      <button class="nav" data-toast="Users isn't part of this concept"><span data-fi="users"></span>Users</button>
      <button class="nav" data-toast="Companies isn't part of this concept"><span data-fi="building"></span>Companies</button>
      <button class="nav" data-toast="Settings isn't part of this concept"><span data-fi="settings"></span>Settings</button>
      <div class="side-h">Problems</div>
      <div id="side-probs"></div>
    </div>
    <div class="side-pin">
      <div id="guide-side"></div>
      <div class="side-foot" id="persona"></div>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <span data-icon="panel" class="hide-sm"></span>
      <div class="crumbs" id="crumbs"></div>
      <div class="bar-actions" id="actions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="guide"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- icons ---------- */
const P = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  inbox:'<path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M5.5 5h13L21 13v6H3v-6z"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/>',
  apps:'<rect x="4" y="6" width="16" height="13" rx="2"/><path d="M8 3h8"/>',
  layers:'<rect x="4" y="8" width="12" height="12" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v10"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.6c1.4.6 2.3 2 2.6 4.4"/>',
  building:'<path d="M4 20V5l8-2v17M12 9h8v11M7 8h2M7 12h2M7 16h2M15 13h2M15 16h2M3 20h18"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  panel:'<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  chevdown:'<path d="m6 9 6 6 6-6"/>',
  chevup:'<path d="m6 15 6-6 6 6"/>',
  more:'<g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></g>',
  filter:'<path d="M5 7h14M8 12h8M10.5 17h3"/>',
  sliders:'<path d="M4 8h8M18 8h2M4 16h2M12 16h8"/><circle cx="15" cy="8" r="2.5"/><circle cx="9" cy="16" r="2.5"/>',
  prev:'<path d="M6.5 6v12"/><path d="M18 6.5v11L9.5 12z" fill="currentColor"/>',
  next:'<path d="M17.5 6v12"/><path d="M6 6.5v11l8.5-5.5z" fill="currentColor"/>',
  full:'<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>',
  comment:'<path d="M5 6.5A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5v8a1.5 1.5 0 0 1-1.5 1.5H11l-4 3v-3h-.5A1.5 1.5 0 0 1 5 14.5z"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>',
  pause:'<path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor" stroke="none"/>',
  reload:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4.5V11h-6.5"/>',
  merge:'<circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7.5v9M8 5.5c5 0 8 2.5 8 6.5"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  shield:'<path d="M12 3 5 6v5.5c0 4.3 3 7.6 7 9.5 4-1.9 7-5.2 7-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.7 3.6-5.6 7-5.6s6.2 1.9 7 5.6"/>',

const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const RP = {D:7.6, events:[
  {t:0.4,  cap:'Maya opens her session notes', mk:false},
  {t:1.3,  cap:`Pastes her notes (${fmt(NOTE_LEN)} characters)`, mk:true},
  {t:2.2,  cap:'App says “Saved”', mk:true},
  {t:4.2,  cap:'Maya refreshes the page', mk:true},
  {t:4.9,  cap:'Her note is gone', mk:true, bug:true},
]};
function miniMarkup({url, editable}){

      <div class="mini-body">

          ${editable?'<textarea id="pv-text" aria-label="Session notes" spellcheck="false"></textarea>':'<div class="txt"></div>'}

        </div>
        <div class="mini-foot">

const tc = s=>`00:00:${String(Math.round(s)).padStart(2,'0')}`;
function mountReplay(root){
  root.innerHTML = miniMarkup({url:'resonance-app-lilac.vercel.app/workshops/wheel-101/notes', editable:false}) +
    `<div class="rp-track" role="slider" aria-label="Replay position" tabindex="0">
      <div class="rp-rail"></div><div class="rp-fill"></div>
      ${RP.events.filter(e=>e.mk).map(e=>`<span class="rp-mk ${e.bug?'bug':''}" style="left:${e.t/RP.D*100}%"></span>`).join('')}
      <span class="rp-knob"></span>
    </div>
    <div class="rp-ctl">
      <span class="rp-time"><b>${tc(0)}</b> / ${tc(RP.D)}</span>
      <div class="rp-mid">
        <button class="rp-skip" data-skip="-1" aria-label="Previous event" title="Previous event">${ic('prev',15)}</button>
        <button class="rp-play" aria-label="Pause replay">${ic('pause',15)}</button>
        <button class="rp-skip" data-skip="1" aria-label="Next event" title="Next event">${ic('next',15)}</button>
      </div>
      <div class="rp-end">
        <button class="rp-x" aria-label="More" data-toast="Session options aren't part of this concept">${ic('more',15)}</button>
        <button class="rp-x" aria-label="Open full session" data-toast="The full session view isn't part of this concept">${ic('full',14)}</button>
      </div>
    </div>
    <div class="rp-cap"><span class="rp-cap-t"></span></div>`;
  const q=s=>root.querySelector(s);
  const txt=q('.txt'), ph=q('.ph'), count=q('.mini-count'), status=q('.mini-status'), reloading=q('.mini-reloading'),
        cursor=q('.mini-cursor'), flag=q('.mini-flag'), fill=q('.rp-fill'), knob=q('.rp-knob'), time=q('.rp-time b'), cap=q('.rp-cap'),
        play=q('.rp-play'), track=q('.rp-track'), page=q('.mini-inner');
  /* the recording only covers the page, so the cursor leaves the top edge when Maya reaches for the browser's refresh */
  const path=[[0,.82,.86],[1.0,.42,.62],[3.3,.44,.64],[4.05,.14,-.1],[4.6,.14,-.1],[5.6,.5,.68],[RP.D,.5,.68]];
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  let t=0, playing=true, last=performance.now(), raf, lastClick=-1;
  function pos(tt){for(let i=0;i<path.length-1;i++){const [a,ax,ay]=path[i],[b,bx,by]=path[i+1];if(tt>=a&&tt<=b){const k=ease((tt-a)/(b-a||1));return [ax+(bx-ax)*k, ay+(by-ay)*k];}}return [path.at(-1)[1],path.at(-1)[2]];}
  function render(){
    const hasText = t>=1.3 && t<4.35;
    txt.textContent = hasText ? NOTE : '';
    ph.style.display = hasText ? 'none' : '';
    count.textContent = hasText ? `${fmt(NOTE_LEN)} characters` : '';
    let st='', cls='';
    if(t>=1.6 && t<2.2){st='Saving…';}
    else if(t>=2.2 && t<4.35){st=ic('check',12,2.4)+'Saved';cls='saved';}
    status.innerHTML=st; status.className='mini-status '+cls;
    reloading.classList.toggle('on', t>=4.35 && t<4.9);
    flag.classList.toggle('on', t>=4.9);
    const r=page.getBoundingClientRect(); const [x,y]=pos(t);
    cursor.style.transform=`translate(${x*r.width}px,${y*r.height}px)`;
    const clickAt=[1.25].find(c=>t>=c&&t<c+.1);
    if(clickAt!==undefined && clickAt!==lastClick){lastClick=clickAt;cursor.classList.remove('clicking');void cursor.offsetWidth;cursor.classList.add('clicking');}
    const tt=Math.min(t,RP.D);
    fill.style.width=knob.style.left=(tt/RP.D*100)+'%';
    time.textContent=tc(tt);
    let ev=RP.events[0]; for(const e of RP.events) if(t>=e.t) ev=e;
    cap.className='rp-cap'+(ev.bug?' bug':'');
    cap.innerHTML=(ev.bug?bug(C.pink):`<span class="dot" style="color:var(--fg-3)"></span>`)+`<span><b></b></span>`;
    cap.querySelector('b').textContent=ev.cap;
  }
  function loop(now){
    const dt=(now-last)/1000; last=now;
    if(playing){t+=dt; if(t>RP.D+1.2){t=0;lastClick=-1;}}
    render(); raf=requestAnimationFrame(loop);
  }
  play.onclick=()=>{playing=!playing;play.innerHTML=ic(playing?'pause':'play',15);play.setAttribute('aria-label',playing?'Pause replay':'Play replay');};
  const seek=e=>{const r=track.getBoundingClientRect();t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*RP.D;lastClick=-1;};
  track.addEventListener('pointerdown',e=>{seek(e);track.setPointerCapture(e.pointerId);});
  track.addEventListener('pointermove',e=>{if(e.buttons)seek(e);});
  track.addEventListener('keydown',e=>{if(e.key==='ArrowRight')t=Math.min(RP.D,t+.5);if(e.key==='ArrowLeft')t=Math.max(0,t-.5);});
  /* an 8-second clip has no use for ±10s, so the side buttons step between the marked events */
  const marks=RP.events.filter(e=>e.mk).map(e=>e.t);
  root.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{
    const cur=Math.min(t,RP.D);
    t = b.dataset.skip==='1' ? (marks.find(m=>m>cur+.05) ?? RP.D) : ([...marks].reverse().find(m=>m<cur-.4) ?? 0);
    lastClick=-1;
  });
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;t=4.95;play.innerHTML=ic('play',15);}
  raf=requestAnimationFrame(loop);
  return ()=>cancelAnimationFrame(raf);
}

/* ---------- live preview (fixed build) ---------- */
function mountPreview(root){
  root.innerHTML = miniMarkup({url:'resonance-git-prb-1-autosave.vercel.app/workshops/wheel-101/notes', editable:true});
  const P = S.preview || (S.preview = {saved:'', pasted:false, sawSaved:false, refreshed:false, survived:false});
  const ta=root.querySelector('#pv-text'), ph=root.querySelector('.ph'), count=root.querySelector('.mini-count'),
        status=root.querySelector('.mini-status'), reloading=root.querySelector('.mini-reloading');
  ta.value=P.saved; let timer, pending=false;
  function paint(){
    ph.style.display=ta.value?'none':'';
    count.textContent=ta.value?`${fmt(ta.value.length)} characters`:'';
  }
  function setStatus(kind){
    status.className='mini-status'+(kind==='saved'?' saved':'');
    status.innerHTML = kind==='saving'?'Saving…':kind==='saved'?ic('check',12,2.4)+'Saved':kind==='dirty'?'Unsaved changes':'';
  }
  function onChange(){
    paint(); pending=true; setStatus('dirty'); clearTimeout(timer);
    if(ta.value.length>2000) P.pasted=true;
    timer=setTimeout(()=>{
      setStatus('saving');
      timer=setTimeout(()=>{ // server confirms first, then the UI says Saved
        P.saved=ta.value; pending=false; setStatus('saved');
        if(P.saved.length>2000){P.sawSaved=true;}
        updateSteps();
      },700);
    },450);
    updateSteps();
  }
  ta.addEventListener('input',onChange);
  root.querySelector('[data-paste]').onclick=()=>{ta.value=NOTE;ta.scrollTop=0;onChange();};
  root.querySelector('[data-reload]').onclick=()=>{
    clearTimeout(timer); reloading.classList.add('on');
    setTimeout(()=>{
      ta.value=P.saved; pending=false; setStatus(''); paint(); reloading.classList.remove('on');
      if(P.sawSaved){P.refreshed=true; P.survived=P.saved.length>2000;}
      updateSteps();
    },650);
  };
  paint(); setStatus(P.saved?'saved':'');
}
function updateSteps(){
  const P=S.preview||{}; const done=[P.pasted,P.sawSaved,P.refreshed,P.survived];
  document.querySelectorAll('.step').forEach((el,i)=>el.classList.toggle('done',!!done[i]));
  const all=done.every(Boolean);
  const msg=$('#decide-msg'); if(!msg) return;
  if(S.status==='verified'){ msg.innerHTML=`<b>You marked this fixed for users.</b> Sam Ortiz reviews the code before it merges.`; return; }
  if(S.status==='recovery'){ msg.innerHTML=`<b>Verified, merged and deployed.</b> This problem is now in recovery.`; return; }
  const n=done.filter(Boolean).length;
  msg.innerHTML = all
    ? `<b>Looks fixed.</b> The long note survived a refresh on the preview.`
    : `<b>${n} of 4 checks done.</b> Try the steps on the preview, then decide.`;
}

    const tick=open?setInterval(()=>{const el=$('#vf-time'); if(el) el.textContent=elapsed();},500):0;
    return ()=>{stop();clearInterval(tick);};
  },
  handoff(){
    crumbs(`<button data-go="inbox">Inbox</button>${ic('chev',13)}<button data-go="problem" class="hide-sm">PRB-1</button><span class="hide-sm">${ic('chev',13)}</span><b>Review fix #482</b>`);
    /* the header, the side card and the merge button all read the same status */
    const merged = S.status==='recovery', verified = S.status==='verified'||merged, sentBack = S.status==='broken';
    actions(merged?`<span class="chip rec hide-sm">${ic('merge',13)}Merged · in recovery</span>`
      :verified?`<span class="chip ok hide-sm">${ic('shield',13)}Verified for users</span>`
      :sentBack?`<span class="chip bad hide-sm">Sent back to agent</span>`
      :`<span class="chip hide-sm"><span class="dot" style="color:var(--fg-3)"></span>Not verified yet</span>`);
    $('#content').innerHTML=`<div class="ho">
      <div class="ho-main">
        <div style="display:flex;flex-direction:column;gap:8px">
          <h1 class="h1 h6">fix(notes): only show Saved after the server confirms</h1>
          <div class="pr-meta">${mark(11)}<span>Opened by Interfere agent</span><span>·</span><span class="branch">interfere/prb-1-autosave</span><span>into</span><span class="branch">main</span><span>·</span><span>Fixes PRB-1</span></div>
        </div>
        <div class="box" style="margin:0"><p style="color:var(--fg-2)">Moves the “Saved” state behind the server response, raises the note limit to 20,000 characters, and surfaces a failed save to the host instead of hiding it. Adds two tests covering long notes and a rejected save.</p></div>
        ${diffHTML(true)}
      </div>
      <aside class="ho-side">
        ${verified?`<div class="vcard">
          <div class="vcard-h">${ic('shield',16)}Verified for users</div>
          <p>Jordan Lee (Support) repeated Maya's session on the preview. The long note survived a refresh.</p>
          ${S.verifierNote?`<div class="quote">“${esc(S.verifierNote)}”</div>`:''}
          <ul>
            <li>${ic('check',13,2.4)}Pasted ${fmt(NOTE_LEN)} characters</li>
            <li>${ic('check',13,2.4)}“Saved” appeared after the server confirmed</li>
            <li>${ic('check',13,2.4)}Refreshed and the note was intact</li>
            <li>${ic('clock',13)}<span>Check recording · ${S.checkTime}</span></li>
          </ul>
        </div>`:sentBack?`<div class="scard"><h4>Verification</h4><p style="margin:0;color:var(--fg-2)">Jordan Lee reported this fix is still broken for users. The agent is working on a new one.</p></div>`
        :`<div class="scard"><h4>Verification</h4><p style="margin:0;color:var(--fg-2)">Not verified for users yet. <button data-go="verify" style="color:var(--ok)">Verify it first</button></p></div>`}
        <div class="scard">
          <h4>Agent</h4>
          <div class="kv"><span>Confidence</span><b>High</b></div>
          <div class="kv"><span>Reproduced before fix</span><b>3 of 3 runs</b></div>
          <div class="kv"><span>Reproduced after fix</span><b>0 of 3 runs</b></div>
        </div>
        <div class="scard">
          <h4>Checks</h4>
          <div class="kv"><span>${ic('test',13)} Tests</span><b style="color:var(--ok)">2 added · passing</b></div>
          <div class="kv"><span>Type check</span><b style="color:var(--ok)">Passing</b></div>
          <div class="kv"><span>Preview build</span><b style="color:var(--ok)">Ready</b></div>
        </div>
        <div class="merge">
          ${merged?`<button class="btn lg primary" disabled>${ic('check',14,2.2)}Merged and deployed</button>
          <button class="btn lg" data-go="problem">View recovery ${ic('chev',13)}</button>`
          :`<button class="btn lg primary" data-act="merge" ${verified?'':'disabled'}>${ic('merge',14)}Approve and merge <kbd>M</kbd></button>
          <button class="btn lg" data-toast="Changes requested. The agent will revise the PR.">Request changes</button>`}
        </div>
        <p style="margin:0;color:var(--fg-3);font-size:12px;line-height:16px">${merged?'Merged after a user check and a code review.':verified?'You review the code. Whether it works for users has already been checked.':'Merge unlocks once a teammate has verified the fix for users.'}</p>
      </aside>
    </div>`;
  }
};
function card(p){
  const live=p.id==='PRB-1';
  let extra='';
  if(live && S.status==='ready') extra=`<span class="chip ok"><span class="dot pulse"></span>Ready to verify · Preview live</span>`;
  if(live && S.status==='verified') extra=`<span class="chip ok">${ic('shield',12)}Verified · awaiting merge</span>`;
  if(live && S.status==='broken') extra=`<span class="chip bad">Sent back to agent</span>`;
  if(live && S.status==='recovery') extra=`<span class="chip rec">0 new since deploy</span>`;
  return `<button class="card ${live&&(S.status==='ready'||S.status==='verified')?'live':''}" ${live?'data-go="problem"':`data-toast="Open PRB-1 for the concept flow"`}>
    <div class="card-id"><span>${p.id}</span>${userFill}</div>
    <div class="card-t">${bugt(C[p.c])}<span>${p.title}</span></div>
    <div class="chips"><span class="chip">${ic('bars',12)}${p.pri}</span><span class="chip tab">${ic('users',12)}${p.users}</span><span class="chip tab">${ic('card',12)}${p.arr}</span><span class="chip tier" aria-hidden="true">${TIERS}<small>+${p.more}</small></span>${extra}</div>
  </button>`;
}
function diffHTML(full){
  const k=s=>`<span class="tk-k">${s}</span>`, f=s=>`<span class="tk-f">${s}</span>`, s=x=>`<span class="tk-s">${x}</span>`, n=x=>`<span class="tk-n">${x}</span>`, c=x=>`<span class="tk-c">${x}</span>`;
  const files=[
    {name:'apps/web/lib/notes/autosave.ts', add:4, del:2, lines:[
      ['',41,`${k('export async function')} ${f('saveNote')}(note, body) {`],
      ['',42,`  ${f('setStatus')}(${s('"saving"')});`],
      ['del',43,`  ${f('setStatus')}(${s('"saved"')});`],
      ['del',44,`  ${k('await')} api.${f('saveNote')}(note.id, body);`],
      ['add',43,`  ${k('const')} res = ${k('await')} api.${f('saveNote')}(note.id, body);`],
      ['add',44,`  ${k('if')} (!res.ok) {`],
      ['add',45,`    ${k('return')} ${f('setStatus')}(${s('"error"')}, res.error);`],
      ['add',46,`  }`],
      ['add',47,`  ${f('setStatus')}(${s('"saved"')});`],
      ['',48,`}`],
    ]},
    {name:'apps/api/routes/notes.ts', add:1, del:1, lines:[
      ['',17,`${k('const')} NoteBody = z.${f('object')}({`],
      ['del',18,`  body: z.${f('string')}().${f('max')}(${n('2000')}),`],
      ['add',18,`  body: z.${f('string')}().${f('max')}(${n('20000')}), ${c('// long session notes')}`],
      ['',19,`});`],
    ]},
  ];
  /* each file opens expanded and collapses from its header, as code blocks do in the app */
  return files.map((fl,i)=>`<div class="code"><button class="code-h" aria-expanded="true" data-toggle="code-${i}">${ic('chev',13)}<span class="ts">TS</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fl.name}</span><span class="stat"><i style="color:var(--add)">+${fl.add}</i> <i style="color:var(--del)">−${fl.del}</i></span></button>
    <div class="code-scroll" id="code-${i}"><table>${fl.lines.map(([t,ln,code])=>`<tr class="${t}"><td class="n">${ln}</td><td>${t==='del'?'- ':t==='add'?'+ ':'  '}${code}</td></tr>`).join('')}</table></div></div>`).join('');
}
const OCC=[2,3,1,4,3,5,2,4,6,3,5,4,7,5,3,6,4,5,8,6,4,5,6]; // occurrences per day, Oct 19 to Nov 10
function drawChart(el){
  const data=OCC;
  const W=520,H=150,L=26,R=8,T=12,B=24,max=10;
  const x=i=>L+i*(W-L-R)/(data.length-1), y=v=>T+(1-v/max)*(H-T-B);
  const line=data.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area=`${line}L${x(data.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const grid=[0,5,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--fg-3)" font-family="Inter,sans-serif">${v}</text>`).join('');
  const labels=[[0,'Oct 19'],[11,'Oct 30'],[22,'Nov 10']].map(([i,t])=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===22?'end':'middle'}" font-size="10" fill="var(--fg-3)" font-family="Inter,sans-serif">${t}</text>`).join('');
  const rec=S.status==='recovery';
  const deployed=rec?`<line x1="${x(22)}" x2="${x(22)}" y1="${T-4}" y2="${y(0)}" stroke="var(--rec)" stroke-dasharray="3 3"/><text x="${x(22)-6}" y="${T+6}" text-anchor="end" font-size="10" fill="var(--rec)" font-family="Inter,sans-serif">Fix deployed</text>`:'';
  el.innerHTML=`<div class="chart-legend"><span><span class="dot" style="color:var(--bad-solid)"></span>Occurrences</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily occurrences from Oct 19 to Nov 10, between 1 and 8 per day">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e54d2e" stop-opacity=".35"/><stop offset="1" stop-color="#e54d2e" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="var(--bad-solid)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${x(22)}" cy="${y(data[22])}" r="3" fill="var(--bad-solid)"/>${labels}${deployed}</svg>`;
}
function renderBroken(){
  const slot=$('#broken-slot'); if(!slot) return;
  slot.innerHTML = S.brokenOpen ? `<div class="broken">
      <label for="broken-note">What did you see?</label>
      <textarea id="broken-note" placeholder="For example: the note came back, but the last two paragraphs were missing.">${esc(S.verifierNote)}</textarea>
      <div class="row"><button class="btn ghost" data-act="cancel-broken">Cancel <kbd>Esc</kbd></button><button class="btn danger" data-act="send-broken">Send back to agent</button></div>
    </div>` : '';
  if(S.brokenOpen) setTimeout(()=>$('#broken-note')?.focus(),20);
}
/* an action lands on the problem view with a new timeline entry, so bring that entry into view instead of the top of the page */
function showLatest(){
  const last=document.querySelector('.tl > .tl-i:last-child');
  last?.scrollIntoView({block:'end',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function elapsed(){const s=Math.max(0,Math.round((Date.now()-S.verifyStart)/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}

/* ---------- chrome ---------- */
function crumbs(h){$('#crumbs').innerHTML=h;}
function actions(h){$('#actions').innerHTML=h;}
function renderSide(){
  $('#side-probs').innerHTML=SIDE_ORDER.map(id=>{const p=PROBLEMS.find(x=>x.id===id);const on=id==='PRB-1'&&['problem','verify','handoff'].includes(S.view);
    return `<button class="prob ${on?'on':''}" ${id==='PRB-1'?'data-go="problem"':'data-toast="Open PRB-1 for the concept flow"'}>${bugt(C[p.c])}<span>${p.side}</span></button>`;}).join('');
  $('#nav-inbox').classList.toggle('on',S.view==='inbox');
  const eng=S.view==='handoff';
  $('#persona').innerHTML=`<span class="av ${eng?'s':'j'}">${eng?'SO':'JL'}</span><div class="who"><b>${eng?'Sam Ortiz':'Jordan Lee'}</b><small>Viewing as ${eng?'engineer':'support'}</small></div>${mark(14)}`;
}
const GUIDE=[
  {v:'inbox',   t:'Inbox',          d:'A new “Ready to verify” status. Fixes wait here for a teammate.'},
  {v:'problem', t:'Problem',        d:'The 10-second moment, a plain root cause, and the suggested fix with its preview.'},
  {v:'verify',  t:'Verify the fix', d:'Repeat what the user did on the preview. The checklist ticks itself off.'},
  {v:'handoff', t:'Engineer review',d:'Code review with the user check attached. Merge, then watch recovery.'},
];
function renderGuide(){
  $('#guide-side').innerHTML=`<div class="gs" role="complementary" aria-label="Concept walkthrough">
    <div class="gs-h"><span class="guide-mark">${ic('shield',14)}</span><div><b>Verify the fix</b><small>Concept for Interfere by Avto Grigolia</small></div></div>
    <div class="gs-steps">${GUIDE.map((s,i)=>`<button class="gstep ${S.view===s.v?'on':''}" data-go="${s.v}"><span class="num">${i+1}</span><span><b>${s.t}</b><small>${s.d}</small></span></button>`).join('')}</div>
    <div class="gs-foot"><span>Sample data</span><button data-act="reset">Reset demo</button></div>
  </div>`;
  $('#guide').innerHTML=`<nav class="gbar" aria-label="Concept walkthrough">${GUIDE.map((s,i)=>`<button class="gstep ${S.view===s.v?'on':''}" data-go="${s.v}"><span class="num">${i+1}</span><b>${['Inbox','Problem','Verify','Review'][i]}</b></button>`).join('')}</nav>`;
}
function go(v, push=true){
  if(!views[v]) v='inbox';
  if(cleanup){cleanup();cleanup=null;}
  /* After a fix is sent back, opening Verify stands in for the agent's next preview, so a fresh check starts. Verified and merged problems keep their status. */
  const retry = v==='verify' && S.status==='broken';
  if(retry) Object.assign(S,{status:'ready',preview:null,verifyStart:0,verifierNote:'',brokenOpen:false});
  S.view=v;
  document.body.dataset.view=v; // the toast moves out of the decision bar's corner on the verify screen
  if(push && location.hash!=='#'+v) history.replaceState(null,'','#'+v);
  cleanup=views[v]()||null;
  $('#content').scrollTop=0;
  renderSide(); renderGuide();
  if(retry) toast('The agent shipped a new preview. Check it again.');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault();go(g.dataset.go);return;}
  const t=e.target.closest('[data-toast]'); if(t){toast(t.dataset.toast);return;}
  const tg=e.target.closest('[data-toggle]'); if(tg){const el=document.getElementById(tg.dataset.toggle);el.hidden=!el.hidden;tg.setAttribute('aria-expanded',String(!el.hidden));return;}
  if(e.target.closest('[data-copy]')){const txt=$('#draft').textContent;navigator.clipboard?.writeText(txt).then(()=>toast('Copied draft'),()=>{const r=document.createRange();r.selectNodeContents($('#draft'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Draft selected. Press ⌘C to copy');});return;}
  const a=e.target.closest('[data-act]'); if(!a) return; act(a.dataset.act);
});
function act(k){
  if(['fixed','broken','send-broken'].includes(k) && S.status!=='ready') return; // a decision is only open while the fix is waiting to be verified
  if(k==='fixed'){ S.checkTime=elapsed(); S.status='verified'; toast('Marked fixed for users. Sam will review the code.'); go('handoff'); }
  if(k==='broken'){ S.brokenOpen=true; renderBroken(); }
  if(k==='cancel-broken'){ S.brokenOpen=false; renderBroken(); }
  if(k==='send-broken'){ S.verifierNote=($('#broken-note')?.value||'').trim(); S.checkTime=elapsed(); S.status='broken'; S.brokenOpen=false; toast('Sent back to the agent with your note'); go('problem'); showLatest(); }
  if(k==='merge' && S.status==='verified'){ S.status='recovery'; toast('Merged #482. Deploying to production.'); go('problem'); showLatest(); }
  if(k==='reset'){ Object.assign(S,{status:'ready',verifyStart:0,checkTime:'0:00',verifierNote:'',brokenOpen:false,preview:null}); go('inbox'); toast('Demo reset'); }
}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const typing=/TEXTAREA|INPUT/.test(document.activeElement?.tagName);
  if(e.key==='Escape' && S.brokenOpen){S.brokenOpen=false;renderBroken();return;}
  if(typing) return;
  const key=e.key.toLowerCase();
  if(S.view==='verify' && S.status==='ready'){ if(key==='f'){e.preventDefault();act('fixed');} if(key==='b'){e.preventDefault();act('broken');} }
  if(S.view==='problem' && key==='v' && S.status==='ready'){e.preventDefault();go('verify');}
  if(S.view==='handoff' && key==='m'){e.preventDefault();act('merge');}
});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1); if(v!==S.view && views[v]) go(v,false);});
window.addEventListener('resize',()=>{});

go(views[location.hash.slice(1)]?location.hash.slice(1):'inbox', false);
</script>

</body>
</html>
